<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUGMUG Rollforming · Service Desk</title>
<style>
:root{
  --ink:#0b1220; --steel:#16212f; --steel-2:#1f2d3f; --canvas:#eff3f7; --surface:#fff;
  --line:#d9e2ec; --line-soft:#eaf0f6; --muted:#617288; --muted-2:#8798ac;
  --accent:#0e7490; --accent-2:#14b8a6; --accent-soft:#e0f4f7;
  --ok:#047857; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7;
  --late:#be123c; --late-soft:#ffe4e6; --done:#0369a1; --done-soft:#e0f2fe;
  --pri:#7c2d92; --shadow:0 1px 2px rgba(11,18,32,.06),0 8px 24px -12px rgba(11,18,32,.18);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--accent-soft)}
input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfdfe;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled,textarea:disabled{background:#f1f4f8;color:var(--muted-2)}
/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% -10%,#243549,var(--steel) 55%,#0d1620)}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;padding:32px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--steel);display:grid;place-items:center;flex:none}
.brand-mark span{display:block;width:16px;height:3px;background:var(--accent-2);box-shadow:0 5px 0 #fff,0 -5px 0 #fff;border-radius:2px}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.brand p{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.login-card h2{font-size:20px;margin:22px 0 2px;letter-spacing:-.02em}
.login-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px}
.segs{display:flex;gap:5px;background:#eef2f6;border-radius:10px;padding:4px;margin-bottom:14px}
.seg{flex:1;padding:8px 0;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg.on{background:var(--steel);color:#fff}
label.field{display:block;margin-bottom:13px}
.field .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:650;border:1px solid transparent;transition:.15s}
.btn-primary{background:var(--steel);color:#fff}
.btn-primary:hover{background:var(--steel-2)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#0c6076}
.btn-ghost{border-color:var(--line);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{background:var(--line-soft)}
.btn-danger{color:var(--late);border-color:#f6cdd6;background:#fff}
.btn-danger:hover{background:var(--late-soft)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{background:var(--late-soft);color:var(--late);font-size:12.5px;padding:8px 11px;border-radius:8px;margin-bottom:13px;border:1px solid #f6cdd6}
.login-hint{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center}
/* shell */
.shell{display:grid;min-height:100vh;grid-template-columns:216px 1fr}
.sidebar{background:var(--steel);color:#c8d4e2;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.sidebar .brand{padding:4px 6px 18px}
.sidebar .brand h1{color:#fff;font-size:14px}
.sidebar .brand p{color:#7d8fa5;font-size:9.5px}
.nav-btn{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:550;color:#a9b8c9;text-align:left;transition:.13s}
.nav-btn:hover{background:#22303f;color:#fff}
.nav-btn.on{background:var(--accent);color:#fff;font-weight:650}
.nav-btn .ico{width:16px;text-align:center;font-size:13px;flex:none}
.nav-sep{height:1px;background:#2a3a4c;margin:11px 4px}
.who{margin-top:auto;padding:11px 10px 4px;border-top:1px solid #2a3a4c}
.who b{display:block;color:#fff;font-size:12.5px}
.who span{font-size:10.5px;color:#7d8fa5;letter-spacing:.05em;text-transform:uppercase;font-weight:650}
main{padding:22px 26px 40px;min-width:0;overflow-x:hidden}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.page-head h2{font-size:22px;letter-spacing:-.025em;line-height:1.15}
.page-head p{color:var(--muted);font-size:12.5px;margin-top:2px}
.toastline{color:var(--ok);font-size:13px;font-weight:700}
/* cards / kpi */
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--accent))}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--k,var(--ink));line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:3px}
.kpi .s{font-size:10px;color:var(--muted-2);margin-top:1px}
/* table */
table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface)}
thead th{text-align:left;padding:9px 12px;background:#f7fafc;border-bottom:1px solid var(--line);font-size:10px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:#f5fbfc}
tbody tr:last-child td{border-bottom:none}
.pcode{font-family:var(--mono);font-size:11.5px;font-weight:700;white-space:nowrap}
/* pills */
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border:1px solid;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok);border-color:#a7e8c4}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:#fcd77f}
.p-late{background:var(--late-soft);color:var(--late);border-color:#f6cdd6}
.p-done{background:var(--done-soft);color:var(--done);border-color:#a9d8f5}
.p-mute{background:#f1f4f8;color:var(--muted);border-color:var(--line)}
.p-pri{background:#fae8ff;color:var(--pri);border-color:#e9b8f2}
/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px;align-items:center}
.toolbar input[type=search],.toolbar select{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12.5px}
.toolbar input[type=search]{min-width:180px}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
.dsub{font-size:10.5px;color:var(--muted-2)}
.empty{padding:34px 16px;text-align:center;color:var(--muted-2);font-size:12.5px}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(11,18,32,.55);display:grid;place-items:center;padding:16px;z-index:90;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:15px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h3{font-size:16px;letter-spacing:-.02em}
.x{width:28px;height:28px;border-radius:7px;color:var(--muted);font-size:18px;line-height:1;flex:none}
.x:hover{background:var(--line-soft);color:var(--ink)}
.modal-b{padding:16px 20px}
@media (max-width:760px){.shell{grid-template-columns:1fr}.sidebar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px}.sidebar .brand{padding:2px 6px;width:100%}.who{margin-top:0;border-top:none;padding:4px 8px;margin-left:auto}main{padding:16px 14px 32px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
try {
const { useState, useEffect, useRef } = React;
const e = React.createElement;

// ================= CONFIG =================
const APP_VERSION = "9.5.0";
const PRIORITIES = ["Low", "Medium", "High", "Critical"];
const STATUSES = ["Open", "In Progress", "Resolved", "Closed"];
const ROUTE_STAGES = [
  "Quotation Sent", "P.O. Received", "Raw Material Cutting", "Rough Machining",
  "Keyway", "Heat Treatment", "Re-Machining", "Final Inspection",
  "Packed", "Invoice Done", "Dispatched"
];
const BREAKDOWN_TYPES = ["Roll Tool Breakdown", "Shaft / Spindle Issue", "Gearbox / Drive Issue", "Electrical / PLC Issue", "Hydraulic Issue", "Alignment / Setup", "Spare Part Request", "Other"];

const C = {
  ink: "#0b1220", steel: "#16212f", steel2: "#1f2d3f", canvas: "#eff3f7",
  surface: "#ffffff", line: "#d9e2ec", mute: "#617288", text: "#182433",
  amber: "#b45309", amberBg: "#fef3c7", green: "#047857", greenBg: "#dcfce7",
  red: "#be123c", redBg: "#ffe4e6", blue: "#0369a1", blueBg: "#e0f2fe",
  purple: "#7c2d92", purpleBg: "#fae8ff", gold: "#d97706",
  accent: "#0e7490", accent2: "#14b8a6"
};
const STATUS_TONE = { "Open": "p-done", "In Progress": "p-warn", "Resolved": "p-pri", "Closed": "p-ok" };
const PRIORITY_TONE = { "Low": "p-mute", "Medium": "p-done", "High": "p-warn", "Critical": "p-late" };

// ================= STORAGE =================
const MEM = {};
const Store = {
  ok: (function () { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch (err) { return false; } })(),
  get(k) {
    try {
      const raw = this.ok ? localStorage.getItem(k) : MEM[k];
      return raw ? JSON.parse(raw) : null;
    } catch (err) { return null; }
  },
  set(k, v) {
    const raw = JSON.stringify(v);
    if (this.ok) { try { localStorage.setItem(k, raw); } catch (err) { MEM[k] = raw; return false; } }
    else MEM[k] = raw;
    return true;
  },
  usage() {
    if (!this.ok) return 0;
    let n = 0;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); n += (localStorage.getItem(k) || "").length + k.length; } } catch (err) {}
    return n;
  }
};
const K = {
  admin: "jm7_admin", staff: "jm7_staff", customers: "jm7_customers",
  complaints: "jm7_complaints", activity: "jm7_activity", feedback: "jm7_feedback",
  sops: "jm7_sops", session: "jm7_session", seq: "jm7_seq"
};

// ================= CLOUD DATA LAYER (Supabase-backed) =================
// All data lives in the JUGMUG Supabase project (same as the Die Tooling
// Platform). The client keeps an in-memory snapshot; every save is diffed
// row-by-row and pushed to the service-desk API; a background poll keeps
// every signed-in device in sync.
const API_URL = (typeof window !== "undefined" && window.__SD_API_URL) ||
  "https://nppfrpqlipihrfvzeegx.supabase.co/functions/v1/service-desk";

function emptyDB() { return { admin: { password: "" }, branding: null, staff: [], customers: [], complaints: [], activity: [], feedback: [], sops: [], quotes: [] }; }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

let CACHE = emptyDB();               // client working copy (source for loadDB)
let SNAP = deepCopy(CACHE);          // last state confirmed with server (diff base)
let SESSION = null;                  // { token, user }
let PENDING = 0;                     // saves in flight (poll pauses while > 0)
let SYNC_ERR = "";                   // last sync error, shown in UI

async function apiCall(action, payload) {
  const body = Object.assign({ action: action, token: SESSION ? SESSION.token : null }, payload || {});
  const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let j = null;
  try { j = await res.json(); } catch (e2) { throw new Error("Server unreachable (" + res.status + ")"); }
  if (!j.ok) { const er = new Error(j.error || "Server error"); er.code = j.code; throw er; }
  return j;
}

function adoptSnapshot(snap) {
  const base = emptyDB();
  ["staff", "customers", "complaints", "activity", "feedback", "sops", "quotes"].forEach(function (k) { if (snap[k]) base[k] = snap[k]; });
  if (snap.admin) base.admin = snap.admin;
  if (snap.branding) { base.branding = snap.branding; applyBrand(snap.branding); Store.set("jm8_brand", normBrand(snap.branding)); }
  CACHE = base;
  SNAP = deepCopy(CACHE);
}

function loadDB() { return deepCopy(CACHE); }

function saveDB(db, keys) {
  const names = (keys || ["admin", "branding", "staff", "customers", "complaints", "activity", "feedback", "sops", "quotes"])
    .filter(function (n) { return n !== "session" && n !== "seq"; });
  const puts = [], dels = [];
  names.forEach(function (name) {
    if (db[name] === undefined) return;
    if (name === "branding") {
      if (db.branding && JSON.stringify(db.branding) !== JSON.stringify(SNAP.branding)) puts.push({ entity: "meta", id: "branding", data: db.branding });
      CACHE.branding = deepCopy(db.branding); SNAP.branding = deepCopy(db.branding);
      return;
    }
    if (name === "admin") {
      if (JSON.stringify(db.admin) !== JSON.stringify(SNAP.admin)) puts.push({ entity: "meta", id: "admin", data: db.admin });
      CACHE.admin = deepCopy(db.admin); SNAP.admin = deepCopy(db.admin);
      return;
    }
    const prev = {}; (SNAP[name] || []).forEach(function (r) { prev[r.id] = r; });
    const seen = {};
    (db[name] || []).forEach(function (r) {
      if (!r || r.id === undefined) return;
      seen[r.id] = true;
      if (!prev[r.id] || JSON.stringify(prev[r.id]) !== JSON.stringify(r)) puts.push({ entity: name, id: r.id, data: r });
    });
    Object.keys(prev).forEach(function (id) { if (!seen[id]) dels.push({ entity: name, id: id }); });
    CACHE[name] = deepCopy(db[name]); SNAP[name] = deepCopy(db[name]);
  });
  if (puts.length || dels.length) {
    PENDING++;
    const pr = apiCall("save", { puts: puts, dels: dels })
      .then(function () { SYNC_ERR = ""; })
      .catch(function (err) { SYNC_ERR = err.message || "Sync failed"; })
      .then(function () { PENDING--; });
    return pr;
  }
  return Promise.resolve();
}

// IDs are derived from the live shared snapshot (max existing number + 1)
function maxNum(list, prefix) {
  let m = 0;
  (list || []).forEach(function (x) {
    if (x && typeof x.id === "string" && x.id.indexOf(prefix) === 0) {
      const n = parseInt(x.id.slice(prefix.length), 10);
      if (!isNaN(n) && n > m) m = n;
    }
  });
  return m;
}
function staffId() { return "STF" + String(maxNum(CACHE.staff, "STF") + 1).padStart(4, "0"); }
function custId() { return "ACC" + String(maxNum(CACHE.customers, "ACC") + 1).padStart(4, "0"); }
function complaintId() {
  const pre = "JM-" + new Date().getFullYear() + "-";
  return pre + String(maxNum(CACHE.complaints, pre) + 1).padStart(4, "0");
}
function newRoute() { return ROUTE_STAGES.map(function (n) { return { n: n, s: "P" }; }); }
function quoteId() {
  const pre = "QT-" + new Date().getFullYear() + "-";
  return pre + String(maxNum(CACHE.quotes, pre) + 1).padStart(4, "0");
}
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }

function logAct(db, by, role, text) {
  db.activity.unshift({ id: uid(), at: Date.now(), by: by, role: role, text: text });
  if (db.activity.length > 400) db.activity.length = 400;
}

// ================= ATTACHMENTS (photos & videos on complaints) =================
const MAX_VIDEO_BYTES = 8 * 1024 * 1024;   // ~15-20s phone clip
const MAX_IMAGE_DIM = 1280;                 // photos auto-compressed client-side
const ATTACH_ACCEPT = "image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime";
function isVideoMime(m) { return String(m || "").indexOf("video/") === 0; }
function fileToDataUrl(file) {
  return new Promise(function (res, rej) {
    const r = new FileReader();
    r.onload = function () { res(r.result); };
    r.onerror = function () { rej(new Error("Could not read file")); };
    r.readAsDataURL(file);
  });
}
function compressImage(file) {
  return fileToDataUrl(file).then(function (durl) {
    return new Promise(function (res) {
      const img = new Image();
      img.onload = function () {
        try {
          let w = img.width, h = img.height;
          const scale = Math.min(1, MAX_IMAGE_DIM / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          res({ dataUrl: cv.toDataURL("image/jpeg", 0.8), mime: "image/jpeg" });
        } catch (e2) { res({ dataUrl: durl, mime: file.type }); }
      };
      img.onerror = function () { res({ dataUrl: durl, mime: file.type }); };
      img.src = durl;
    });
  });
}
// Prepares one attachment: {name, mime, b64} or throws with a friendly message
function prepareAttachment(file) {
  if (isVideoMime(file.type)) {
    if (file.size > MAX_VIDEO_BYTES) return Promise.reject(new Error(file.name + " is too large. Videos must be under 8 MB (about 15-20 seconds)."));
    return fileToDataUrl(file).then(function (durl) {
      return { name: file.name, mime: file.type, b64: durl.split(",")[1] };
    });
  }
  if (String(file.type).indexOf("image/") === 0) {
    return compressImage(file).then(function (r) {
      return { name: file.name.replace(/\.[a-zA-Z0-9]+$/, "") + ".jpg", mime: r.mime, b64: r.dataUrl.split(",")[1] };
    });
  }
  return Promise.reject(new Error(file.name + ": only photos (JPG/PNG/WebP) and videos (MP4/WebM) are allowed."));
}
function uploadAttachment(complaintId, att) {
  return apiCall("upload", { complaintId: complaintId, name: att.name, mime: att.mime, b64: att.b64 })
    .then(function (j) { return j.file; });
}
function AttachmentList(p) {
  const files = p.files || [];
  if (!files.length) return null;
  return e("div", { style: { display: "flex", flexWrap: "wrap", gap: 10, marginTop: 8 } },
    files.map(function (f) {
      return e("div", { key: f.id, style: { border: "1px solid " + C.line, borderRadius: 10, padding: 6, background: "#fff", maxWidth: 220 } },
        isVideoMime(f.mime)
          ? e("video", { src: f.url, controls: true, preload: "metadata", style: { width: 200, maxHeight: 150, borderRadius: 6, background: "#000" } })
          : e("a", { href: f.url, target: "_blank", rel: "noopener" },
              e("img", { src: f.url, alt: f.name, style: { width: 200, height: 130, objectFit: "cover", borderRadius: 6 } })),
        e("div", { style: { display: "flex", alignItems: "center", gap: 6, marginTop: 4 } },
          e("span", { style: { fontSize: 10.5, color: C.mute, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 } }, f.name + " · " + fileSizeStr(f.size || 0)),
          p.onRemove ? e("button", { onClick: function () { p.onRemove(f); }, title: "Remove", style: { color: C.red, fontSize: 12, fontWeight: 700 } }, "✕") : null));
    }));
}
// Attach picker + upload runner used in NewComplaint and ComplaintModal
function AttachControl(p) {
  const ref = useRef(null);
  const [busyMsg, setBusyMsg] = useState("");
  const [errMsg, setErrMsg] = useState("");
  function pick() { if (ref.current) ref.current.click(); }
  function onFiles(ev) {
    const list = Array.from(ev.target.files || []);
    ev.target.value = "";
    if (!list.length) return;
    setErrMsg("");
    let chain = Promise.resolve();
    list.forEach(function (file, i) {
      chain = chain.then(function () {
        setBusyMsg("Uploading " + (i + 1) + " of " + list.length + "…");
        return prepareAttachment(file).then(function (att) { return p.doUpload(att); });
      }).catch(function (e2) { setErrMsg(String(e2.message || e2)); });
    });
    chain.then(function () { setBusyMsg(""); if (p.onDone) p.onDone(); });
  }

const RS_COLOR = { P: "#e3eaf2", I: C.amber, D: C.green, N: "#b6c2d1" };
function RouteStrip(p) {
  return e("div", { style: { display: "flex", gap: 2 } },
    (p.route || []).map(function (r, i) {
      return e("span", { key: i, title: r.n + " — " + ({ P: "Pending", I: "In progress", D: "Done", N: "Not applicable" }[r.s]), style: { width: 9, height: 14, borderRadius: 2, background: RS_COLOR[r.s], display: "inline-block", opacity: r.s === "N" ? 0.35 : 1 } });
    }));
}
function DelayBadge(p) {
  const c = p.c;
  if (!c.targetDate) return e("span", { style: { color: C.mute, fontSize: 12 } }, "—");
  if (c.status === "Closed") {
    const d = delayDays(c);
    return d > 0 ? e(Pill, { text: "Closed " + d + "d late", tone: "p-late" }) : e(Pill, { text: "On time", tone: "p-ok" });
  }
  const b = balanceDays(c.targetDate); // live: >0 days left, <=0 overdue
  if (b > 2) return e(Pill, { text: b + "d left", tone: "p-ok" });
  if (b > 0) return e(Pill, { text: b + "d left", tone: "p-warn" });
  if (b === 0) return e(Pill, { text: "Due today", tone: "p-warn" });
  return e(Pill, { text: "Delayed " + (-b) + "d", tone: "p-late" });
}
// Small live badge for department tasks
function TaskBadge(p) {
  const t = p.t;
  if (t.status === "Done") return e(Pill, { text: "Done", tone: "p-ok" });
  if (!t.targetDate) return e(Pill, { text: t.status, tone: t.status === "In progress" ? "p-warn" : "p-mute" });
  const b = balanceDays(t.targetDate);
  if (b < 0) return e(Pill, { text: "Delayed " + (-b) + "d", tone: "p-late" });
  if (b === 0) return e(Pill, { text: "Due today", tone: "p-warn" });
  return e(Pill, { text: b + "d left", tone: b > 2 ? "p-ok" : "p-warn" });
}

  function upCo(i, k, v) { const n = cos.slice(); n[i] = Object.assign({}, n[i]); n[i][k] = v; setCos(n); }

    const n = cos.slice(); n[i] = Object.assign({}, n[i]);

          e(Field, { label: "Location / address" }, e("input", { style: INPUT_S, value: co.address || "", onChange: function (ev) { upCo(i, "address", ev.target.value); } }))),
        e("div", { style: { fontSize: 12, fontWeight: 700, color: C.mute, textTransform: "uppercase", marginBottom: 6 } }, "Machines at this plant"),
        (co.machines || []).map(function (m, j) {
          return e("div", { key: m.id, style: { display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" } },

function SopLibrary(p) {
  const db = p.db, user = p.user;
  const [title, setTitle] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [viewing, setViewing] = useState(null);
  const fileRef = useRef(null);
  const isAdmin = user.role === "admin";

  function upload() {
    setErr("");
    const f = fileRef.current && fileRef.current.files && fileRef.current.files[0];

// ================= DATA (admin backup/restore/export) =================
function DataTools(p) {
  const db = p.db;
  const [msg, setMsg] = useState("");
  const restoreRef = useRef(null);
  function download(name, mime, content) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([content], { type: mime }));
    a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function backup() {
    const all = loadDB();
    download("jugmug-service-desk-backup-" + new Date().toISOString().slice(0, 10) + ".json", "application/json", JSON.stringify(all, null, 2));
  }
  function restore() {
    const f = restoreRef.current && restoreRef.current.files && restoreRef.current.files[0];
    if (!f) { setMsg("Choose a backup .json file first."); return; }
    const r = new FileReader();
    r.onload = function () {
      try {
        const d = JSON.parse(r.result);
        const db2 = loadDB();
        ["admin", "staff", "customers", "complaints", "activity", "feedback", "sops"].forEach(function (k) { if (d[k] !== undefined) db2[k] = d[k]; });
        saveDB(db2);
        setMsg("Backup restored ✓ — syncing to server.");
        p.refresh();
      } catch (err) { setMsg("That file is not a valid backup."); }
    };
    r.readAsText(f);
  }
  function exportCsv() {
    const live = loadDB();
    const rows = [["ID", "Type", "Customer", "Company", "Machine", "Status", "Priority", "Progress %", "Assigned to", "Target date", "Delay days", "Rating", "Created", "Closed"]];
    live.complaints.forEach(function (c) {
      const cu = live.customers.find(function (x) { return x.id === c.customerId; });
      const co = cu && (cu.companies || []).find(function (x) { return x.id === c.companyId; });
      const m = co && (co.machines || []).find(function (x) { return x.id === c.machineId; });
      rows.push([c.id, c.type, cu ? cu.name : c.customerId, co ? co.name : "", m ? m.code : "", c.status, c.priority, routeProgress(c), c.assignedTo ? staffName(live, c.assignedTo) : "", c.targetDate || "", c.targetDate ? delayDays(c) : "", c.rating ? c.rating.stars : "", fmtDate(c.createdAt), c.closedAt ? fmtDate(c.closedAt) : ""]);
    });
    download("jugmug-complaints-" + new Date().toISOString().slice(0, 10) + ".csv", "text/csv",
      rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(","); }).join("\n"));
  }
  const used = Store.usage();
  const live0 = loadDB();
  let attCount = 0, attBytes = 0, attClosedCount = 0, attClosedBytes = 0;
  live0.complaints.forEach(function (c) {
    (c.attachments || []).forEach(function (f) {
      attCount++; attBytes += (f.size || 0);
      if (c.status === "Closed") { attClosedCount++; attClosedBytes += (f.size || 0); }
    });
  });
  const [cleanMsg, setCleanMsg] = useState("");
  const [cleanConfirm, setCleanConfirm] = useState(null); // "closed" | "all"
  const [cleaning, setCleaning] = useState(false);
  function runClean(scope) {
    setCleaning(true); setCleanConfirm(null); setCleanMsg("Clearing files…");
    const db2 = loadDB();
    const targets = db2.complaints.filter(function (c) { return (c.attachments || []).length && (scope === "all" || c.status === "Closed"); });
    let files = [];
    targets.forEach(function (c) { files = files.concat((c.attachments || []).filter(function (f) { return f.path; })); });
    let chain = Promise.resolve(), done = 0;
    files.forEach(function (f) {
      chain = chain.then(function () {
        return apiCall("deleteFile", { path: f.path }).then(function () { done++; }, function () { done++; });
      });
    });
    chain.then(function () {
      const db3 = loadDB();
      let cleared = 0;
      db3.complaints.forEach(function (c) {
        if ((c.attachments || []).length && (scope === "all" || c.status === "Closed")) { cleared += c.attachments.length; c.attachments = []; }
      });
      logAct(db3, "Admin", "admin", "Admin cleared " + cleared + " photo/video file(s) from " + (scope === "all" ? "all complaints" : "closed complaints") + " to free storage");
      saveDB(db3, ["complaints", "activity"]);
      setCleaning(false);
      setCleanMsg("Done ✓ — " + cleared + " file(s) removed from storage.");
      p.refresh();
    });
  }
  return e("div", null,
    e(Card, { style: { marginBottom: 16 } },
      e(SectionTitle, { title: "Storage cleanup — photos & videos" }),
      e("div", { style: { fontSize: 13, marginBottom: 10 } },
        "Currently on complaints: ", e("b", null, attCount + " file(s) · " + fileSizeStr(attBytes)),
        attClosedCount ? e("span", { style: { color: C.mute } }, "  (of which " + attClosedCount + " file(s) · " + fileSizeStr(attClosedBytes) + " belong to closed complaints)") : null),
      !cleanConfirm ? e("div", { style: { display: "flex", gap: 10, flexWrap: "wrap" } },
        e(Btn, { onClick: function () { setCleanConfirm("closed"); }, disabled: cleaning || !attClosedCount, label: "Clear images from closed complaints" }),
        e(Btn, { kind: "danger", onClick: function () { setCleanConfirm("all"); }, disabled: cleaning || !attCount, label: "Clear ALL images & videos" }))
      : e("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" } },
        e("b", { style: { fontSize: 13, color: C.red } }, cleanConfirm === "all" ? "Delete every photo/video on every complaint? This cannot be undone." : "Delete all photos/videos on closed complaints? This cannot be undone."),
        e(Btn, { kind: "danger", onClick: function () { runClean(cleanConfirm); }, label: "Yes, clear now" }),
        e(Btn, { kind: "ghost", onClick: function () { setCleanConfirm(null); }, label: "Cancel" })),
      cleanMsg ? e("div", { style: { marginTop: 10, fontSize: 13, fontWeight: 600, color: cleanMsg.includes("✓") ? C.green : C.text } }, cleanMsg) : null,
      e("div", { style: { marginTop: 10, fontSize: 12, color: C.mute } }, "Files are deleted from JUGMUG cloud storage to free space. Complaint details, messages and history are not affected.")),
    e(Card, { style: { marginBottom: 16 } },
      e(SectionTitle, { title: "Backup & restore" }),
      e("div", { style: { display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" } },
        e(Btn, { onClick: backup, label: "Download full backup (JSON)" }),
        e(Btn, { kind: "ghost", onClick: exportCsv, label: "Export complaints (CSV)" })),
      e("div", { style: { marginTop: 14, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" } },
        e("input", { style: Object.assign({}, INPUT_S, { maxWidth: 300 }), type: "file", accept: ".json,application/json", ref: restoreRef }),
        e(Btn, { kind: "danger", onClick: restore, label: "Restore from backup" })),
      msg ? e("div", { style: { marginTop: 10, fontSize: 13, fontWeight: 600, color: msg.includes("✓") ? C.green : C.red } }, msg) : null,
      e("div", { style: { marginTop: 12, fontSize: 12, color: C.mute } }, "Data is stored live on the JUGMUG cloud (Supabase) and shared across all devices. Browser storage used locally: " + fileSizeStr(used) + ".")));
}

// ================= CUSTOMER: NEW COMPLAINT =================
function NewComplaint(p) {
  const db = p.db, user = p.user;
  const cu = db.customers.find(function (x) { return x.id === user.id; });
  const companies = (cu && cu.companies) || [];
  const [coId, setCoId] = useState(companies.length ? companies[0].id : "");
  const co = companies.find(function (x) { return x.id === coId; });
  const machines = (co && co.machines) || [];
  const [mId, setMId] = useState("");
  // QR deep link: once the customer's plants arrive, select the scanned plant + machine
  useEffect(function () {
    const qr = window.__SD_QR;
    if (!qr || !companies.length) return;
    const coOk = companies.find(function (x) { return x.id === qr.plant; });
    if (coOk) {
      setCoId(coOk.id);
      if ((coOk.machines || []).some(function (m) { return m.id === qr.machine; })) setMId(qr.machine);
    }
    window.__SD_QR = null;
  }, [companies.length]);
  const [type, setType] = useState(BREAKDOWN_TYPES[0]);
  const [priority, setPriority] = useState("Medium");
  const [desc, setDesc] = useState("");
  const [made, setMade] = useState(null);
  const [pending, setPending] = useState([]);   // prepared attachments waiting for submit
  const [submitting, setSubmitting] = useState(false);
  const [upErr, setUpErr] = useState("");
  useEffect(function () { setMId(machines.length ? machines[0].id : ""); }, [coId]);

  function submit() {
    if (!desc.trim() || !coId || !mId || submitting) return;
    setSubmitting(true);
    const c = {
      id: complaintId(), customerId: user.id, companyId: coId, machineId: mId,
      type: type, priority: priority, desc: desc.trim(), status: "Open",
      route: newRoute(), messages: [], notes: [], attachments: [], assignedTo: null, assignedAt: null,
      targetDate: null, rating: null, createdAt: Date.now(), closedAt: null
    };
    db.complaints.unshift(c);
    logAct(db, user.name, "customer", user.name + " raised complaint " + c.id + " (" + type + ")");
    const saved = saveDB(db, ["complaints", "activity"]);
    const files = pending.slice();
    if (!files.length) {
      setSubmitting(false); setMade(c.id); setDesc(""); setPending([]);
      p.refresh();
      return;
    }
    // Upload only AFTER the complaint row is confirmed on the server —
    // otherwise the server rejects the file with "Complaint not found"
    // and the photos silently disappear for staff/admin.
    const failed = [];
    function uploadOne(att, attempt) {
      return uploadAttachment(c.id, att).then(function (f) {
        const db2 = loadDB();
        const row = db2.complaints.find(function (x) { return x.id === c.id; });
        if (row) { row.attachments = (row.attachments || []).concat([f]); return saveDB(db2, ["complaints"]); }
      }).catch(function (e2) {
        if (attempt < 2) {
          return new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return uploadOne(att, attempt + 1); });
        }
        failed.push(att.name);
      });
    }
    let chain = saved;
    files.forEach(function (att) { chain = chain.then(function () { return uploadOne(att, 1); }); });
    chain.then(function () {
      setSubmitting(false); setMade(c.id); setDesc(""); setPending([]);
      if (failed.length) setUpErr("Complaint submitted, but these files could not be uploaded: " + failed.join(", ") + ". Open the complaint and add them again.");
      else setUpErr("");
      p.refresh();
    });
  }
  if (!companies.length) return e(Card, null, e("div", { style: { fontSize: 14, color: C.mute } }, "No plants or machines are registered on your account yet. Please contact the JUGMUG sales service team."));
  return e(Card, null,
    e(SectionTitle, { title: T("Raise a new complaint") }),
    e("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12 } },
      e(Field, { label: "Company / plant" }, e("select", { style: INPUT_S, value: coId, onChange: function (ev) { setCoId(ev.target.value); } },
        companies.map(function (x) { return e("option", { key: x.id, value: x.id }, x.name); }))),
      e(Field, { label: "Machine" }, e("select", { style: INPUT_S, value: mId, onChange: function (ev) { setMId(ev.target.value); } },
        machines.map(function (m) { return e("option", { key: m.id, value: m.id }, m.code + (m.model ? " — " + m.model : "")); }))),
      e(Field, { label: "Breakdown type" }, e(Sel, { value: type, onChange: function (ev) { setType(ev.target.value); }, options: BREAKDOWN_TYPES })),
      e(Field, { label: "Priority" }, e(Sel, { value: priority, onChange: function (ev) { setPriority(ev.target.value); }, options: PRIORITIES }))),
    e(Field, { label: "Describe the problem" }, e("textarea", { style: Object.assign({}, INPUT_S, { minHeight: 90, resize: "vertical" }), value: desc, onChange: function (ev) { setDesc(ev.target.value); } })),
    e("div", { style: { marginBottom: 12 } },
      e("div", { className: "eyebrow", style: { marginBottom: 6 } }, "Photos / videos of the problem (optional)"),
      e(AttachControl, { doUpload: function (att) { setPending(function (ps) { return ps.concat([att]); }); return Promise.resolve(); } }),
      pending.length ? e("div", { style: { fontSize: 12, color: C.green, fontWeight: 600, marginTop: 6 } }, pending.length + " file(s) attached — they upload when you submit") : null),
    e(Btn, { kind: "accent", onClick: submit, disabled: submitting, label: submitting ? "…" : T("Submit complaint") }),
    made ? e("div", { style: { marginTop: 12, padding: 12, background: C.greenBg, borderRadius: 8, fontSize: 14 } }, e("b", null, "Submitted! "), "Your complaint number is ", e("b", null, made), ". Track it under “My complaints”.") : null,
    upErr ? e("div", { style: { marginTop: 10, padding: 10, background: C.redBg, borderRadius: 8, fontSize: 13, color: C.red, fontWeight: 600 } }, upErr) : null);
}

function BrandingPage(p) {
  const saved = normBrand(p.db.branding || BRAND);
  const [company, setCompany] = useState(saved.company);
  const [short, setShort] = useState(saved.short);
  const [tagline, setTagline] = useState(saved.tagline);
  const [sidebar, setSidebar] = useState(saved.sidebar);
  const [accent, setAccent] = useState(saved.accent);
  const [logo, setLogo] = useState(saved.logo);
  const [addr, setAddr] = useState(saved.address);
  const [phone, setPhone] = useState(saved.phone);
  const [gstin, setGstin] = useState(saved.gstin);
  const [timing, setTiming] = useState(saved.timing);
  const [fb, setFb] = useState(saved.fb);
  const [ig, setIg] = useState(saved.ig);
  const [yt, setYt] = useState(saved.yt);
  const [msg, setMsg] = useState("");
  const logoRef = useRef(null);
  const draft = { company: company, short: short, tagline: tagline, sidebar: sidebar, accent: accent, logo: logo,
    address: addr, phone: phone, gstin: gstin.trim(), timing: timing, fb: fb.trim(), ig: ig.trim(), yt: yt.trim(), terms: saved.terms };

  function onLogo(ev) {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    if (f.size > 300 * 1024) { setMsg("Logo must be under 300 KB. Please use a smaller image."); return; }
    if (String(f.type).indexOf("image/") !== 0 && f.type !== "image/svg+xml") { setMsg("Logo must be PNG, JPG, SVG or WebP."); return; }
    fileToDataUrl(f).then(function (durl) { setLogo(durl); setMsg(""); });
  }
  function save() {
    const db2 = loadDB();
    db2.branding = normBrand(draft);
    applyBrand(db2.branding);
    Store.set("jm8_brand", db2.branding);
    logAct(db2, p.user.name, "admin", "Branding updated");
    saveDB(db2, ["branding", "activity"]);
    setMsg("Branding saved ✓ — applied for every user on all devices.");
    p.refresh();
  }

  const [rev, setRev] = useState(0);
  const [openC, setOpenC] = useState(null);
  const [selfPw, setSelfPw] = useState(false);
  const [toastMsg, setToastMsg] = useState("");
  const db = loadDB();
  useEffect(function () {
    const t = setInterval(function () { setRev(function (x) { return x + 1; }); }, 60000);
    return function () { clearInterval(t); };
  }, []);

  function refresh(withToast) {
    setRev(function (x) { return x + 1; });
    if (withToast) {
      setToastMsg("Refreshed ✓"); setTimeout(function () { setToastMsg(""); }, 1800);
      if (SESSION) apiCall("load").then(function (j) {
        if (PENDING === 0) { adoptSnapshot(j.snapshot); setRev(function (x) { return x + 1; }); }
      }, function () {});
    }
  }
  function login(u) { setUser(u); setPage("home"); }
  function logout() {
    if (SESSION) apiCall("logout").then(function () {}, function () {});
    SESSION = null; Store.set(K.session, null);
    adoptSnapshot({});
    setUser(null); setPage("home");
  }
  // On mount with a stored session: validate + pull fresh data. Then poll
  // every 5s so all devices see live updates (like the die platform feed).
  useEffect(function () {
    if (!user || !SESSION || (typeof window !== "undefined" && window.__SD_NO_POLL)) return;
    let dead = false;
    let lastHash = "";
    function pull() {
      apiCall("load").then(function (j) {
        if (dead) return;
        SYNC_ERR = "";
        if (PENDING === 0) {
          const h = JSON.stringify(j.snapshot);
          if (h !== lastHash) {              // skip identical snapshots — no useless rerenders
            lastHash = h;
            adoptSnapshot(j.snapshot);
            setRev(function (x) { return x + 1; });
          }
        }
      }).catch(function (err) {
        if (dead) return;
        if (err.code === "AUTH") { SESSION = null; Store.set(K.session, null); setUser(null); }
        else SYNC_ERR = err.message || "Sync failed";
      });
    }
    pull();
    const t = setInterval(pull, 5000);
    return function () { dead = true; clearInterval(t); };
  }, [user && user.id]);
  function saveOwnPassword(npw) {
    const db2 = loadDB();
    if (user.role === "admin") { db2.admin.password = npw; saveDB(db2, ["admin"]); }

    else { const cu = db2.customers.find(function (x) { return x.id === user.id; }); if (cu) { cu.password = npw; saveDB(db2, ["customers"]); } }
    logAct(db2, user.name, user.role, user.name + " changed their password");
    saveDB(db2, ["activity"]);

function inr(n) { return "\u20B9 " + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 }); }
function inr2(n) { return "\u20B9 " + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: 2 }); }
function rsTxt(n) { return "Rs. " + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 }); }
function quoteTotals(qt) {
  const sub = (qt.items || []).reduce(function (a, it) { return a + (Number(it.qty) || 0) * (Number(it.rate) || 0); }, 0);
  const disc = Number(qt.discount) || 0;
  const taxable = Math.max(0, sub - disc);
  const gst = taxable * (Number(qt.gstPct) || 0) / 100;
  const raw = taxable + gst;
  const grand = Math.round(raw);
  return { sub: sub, disc: disc, taxable: taxable, gst: gst, round: grand - raw, grand: grand };
}
function quoteGrand(qt) { return qt.kind === "general" ? quoteTotals(qt).grand : (qt.grand || 0); }
function ApprovalPill(p) {
  const qt = p.qt;
  if (!qt.complaintId) return null;
  if (!qt.approval) return e(Pill, { text: "Awaiting approval", tone: "p-warn" });
  return e(Pill, { text: qt.approval.status, tone: qt.approval.status === "Approved" ? "p-ok" : "p-late" });

// ---- PDF engine (lazy jsPDF from CDN) ----
let JSPDF_LOADING = null;
function loadJsPdf() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (JSPDF_LOADING) return JSPDF_LOADING;
  JSPDF_LOADING = new Promise(function (res, rej) {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    sc.onload = function () { window.jspdf && window.jspdf.jsPDF ? res(window.jspdf.jsPDF) : rej(new Error("jsPDF missing")); };
    sc.onerror = function () { rej(new Error("Could not load PDF engine")); };
    document.head.appendChild(sc);
  });
  return JSPDF_LOADING;
}

// QR sticker sheet — lazy-load qrcodejs, open printable window
let QRLIB_LOADING = null;
function loadQrLib() {
  if (window.QRCode) return Promise.resolve(window.QRCode);
  if (QRLIB_LOADING) return QRLIB_LOADING;
  QRLIB_LOADING = new Promise(function (res, rej) {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
    sc.onload = function () { window.QRCode ? res(window.QRCode) : rej(new Error("QR library missing")); };

    document.head.appendChild(sc);
  });

}

          e(Pill, { text: qt.kind === "general" ? "GST" : (qt.kind === "vmc" ? "VMC" : qt.ptype), tone: "p-pri" }),
          e("span", { style: { flex: "1 1 180px" } }, e("b", null, who), e("span", { style: { color: C.mute, fontSize: 12 } }, " \u00B7 " + what + (qt.qty ? " \u00B7 " + qt.qty + " pc" : ""))),
          e("b", { style: { whiteSpace: "nowrap", color: C.amber } }, inr(g)),
          qt.complaintId ? e("span", { className: "pcode", style: { fontSize: 11 } }, qt.complaintId) : null,
          e(ApprovalPill, { qt: qt }),
          e("span", { style: { fontSize: 11, color: C.mute } }, qt.by + " \u00B7 " + fmtDate(qt.at)),
          e(Btn, { small: true, onClick: function () { anyQuotePdf(qt).catch(function (e2) { setMsg("PDF engine could not load: " + e2.message); }); }, label: "PDF" }),
          (user.role === "admin" || qt.byId === user.id) ? (delQ === qt.id
            ? e("span", { style: { display: "inline-flex", gap: 8, alignItems: "center" } },
                e("b", { style: { fontSize: 12, color: C.red } }, "Delete?"),
                e(Btn, { small: true, kind: "danger", onClick: function () { removeQuote(qt); }, label: "Yes" }),
                e(Btn, { small: true, kind: "ghost", onClick: function () { setDelQ(null); }, label: "No" }))
            : e(Btn, { small: true, kind: "danger", onClick: function () { setDelQ(qt.id); }, label: "Delete" })) : null);
      }) : e("div", { style: { fontSize: 13, color: C.mute } }, "No quotes saved yet. Calculate a part and press Save Quote."),
      e("div", { style: { fontSize: 12, color: C.mute, marginTop: 8 } }, "Saved quotes are shared \u2014 everyone on the team sees the same list (turned, VMC and GST quotes together). Customers never see this page.")));
}

// ================= TASK REMINDERS (big popup on login) =================
function collectReminders(db, user) {
  // Reminders are ONLY for department members, about their own assigned tasks.
  const items = [];
  const dept = deptOf(db, user);
  if (!dept) return items;
  db.complaints.forEach(function (c) {
    (c.deptTasks || []).forEach(function (t) {
      if (t.status === "Done" || !t.targetDate) return;
      if (t.deptId !== user.id) return;
      const b = balanceDays(t.targetDate);
      if (b <= 2) items.push({ kind: "task", cid: c.id, label: (t.dept || "Dept") + " task · " + t.text + " · " + c.id, b: b, who: staffName(db, t.deptId) });
    });
  });
  items.sort(function (a, b2) { return a.b - b2.b; });
  return items;
}
function ReminderPopup(p) {
  const db = p.db, user = p.user;
  const [dismissed, setDismissed] = useState(false);
  const dayKey = "sd_rem_" + user.id + "_" + new Date().toISOString().slice(0, 10);
  let seen = false;
  try { seen = !!sessionStorage.getItem(dayKey); } catch (e2) {}
  if (dismissed || seen) return null;
  const items = collectReminders(db, user);
  if (!items.length) return null;
  const overdue = items.filter(function (i) { return i.b < 0; }).length;
  function close() {
    try { sessionStorage.setItem(dayKey, "1"); } catch (e2) {}
    setDismissed(true);
  }
  return e(Modal, { title: "⏰ Task reminders — " + user.name, onClose: close, width: 640 },
    e("div", { style: { fontSize: 15, fontWeight: 700, color: overdue ? C.red : C.amber, marginBottom: 12 } },
      overdue ? overdue + " item(s) OVERDUE — please act today." : "You have deadlines within 2 days."),
    items.slice(0, 15).map(function (i, idx) {
      const late = i.b < 0;
      return e("div", {
        key: idx,
        onClick: function () { close(); p.onOpen(i.cid); },
        style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", padding: "10px 12px", marginBottom: 8, borderRadius: 8, cursor: "pointer", background: late ? C.redBg : C.amberBg, border: "1px solid " + (late ? "#f3c2cd" : "#f2e2ad") }
      },
        e(Pill, { text: late ? "OVERDUE " + (-i.b) + "d" : (i.b === 0 ? "DUE TODAY" : i.b + "d left"), tone: late ? "p-late" : "p-warn" }),
        e("span", { style: { flex: "1 1 240px", fontSize: 13, fontWeight: 600 } }, i.label));
    }),
    items.length > 15 ? e("div", { style: { fontSize: 12, color: C.mute, marginBottom: 8 } }, "+ " + (items.length - 15) + " more…") : null,
    e("div", { style: { display: "flex", gap: 10, marginTop: 8 } },
      e(Btn, { kind: "accent", onClick: close, label: "OK, got it" })),
    e("div", { style: { fontSize: 11, color: C.mute, marginTop: 8 } }, "This reminder shows once a day per device. Tap any item to open it."));
}

// ================= DEPARTMENT DESK =================
function DeptDesk(p) {
  const db = p.db, user = p.user;
  const dept = deptOf(db, user) || "Department";
  const rows = [];
  db.complaints.forEach(function (c) {
    (c.deptTasks || []).forEach(function (t) {
      if (t.deptId === user.id) rows.push({ c: c, t: t });
    });
  });
  const open = rows.filter(function (r) { return r.t.status !== "Done"; });
  const overdue = open.filter(function (r) { return r.t.targetDate && balanceDays(r.t.targetDate) < 0; });
  const sorted = rows.slice().sort(function (a, b) {
    const da = a.t.status === "Done" ? 1 : 0, dbb = b.t.status === "Done" ? 1 : 0;
    if (da !== dbb) return da - dbb;
    const ta = a.t.targetDate ? new Date(a.t.targetDate).getTime() : 9e15;
    const tb = b.t.targetDate ? new Date(b.t.targetDate).getTime() : 9e15;
    return ta - tb;
  });
  return e("div", null,
    e("div", { style: { display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 } },
      e(StatCard, { label: "My tasks", value: rows.length }),
      e(StatCard, { label: "Open", value: open.length, color: C.blue }),
      e(StatCard, { label: "Overdue", value: overdue.length, color: overdue.length ? C.red : C.green }),
      e(StatCard, { label: "Done", value: rows.length - open.length, color: C.green })),
    e(Card, null,
      e(SectionTitle, { title: dept + " department — assigned tasks (" + rows.length + ")" }),
      sorted.length ? e("div", { style: { overflowX: "auto" } }, e("table", null,
        e("thead", null, e("tr", null, ["Complaint", "Customer", "Task", "Target", "Balance", "Status", ""].map(function (t) { return e("th", { key: t }, t); }))),
        e("tbody", null, sorted.map(function (r) {
          return e("tr", { key: r.t.id, onClick: function () { p.onOpen(r.c.id); }, style: { cursor: "pointer" } },
            e("td", null, e("span", { className: "pcode" }, r.c.id)),
            e("td", null, custName(db, r.c.customerId)),
            e("td", null, r.t.text),
            e("td", null, r.t.targetDate ? fmtDate(new Date(r.t.targetDate + "T00:00:00").getTime()) : "—"),
            e("td", null, e(TaskBadge, { t: r.t })),
            e("td", null, r.t.status),
            e("td", null, e(Btn, { small: true, kind: "ghost", onClick: function (ev) { if (ev && ev.stopPropagation) ev.stopPropagation(); p.onOpen(r.c.id); }, label: "Open" })));
        }))))
        : e("div", { style: { fontSize: 13, color: C.mute } }, "No tasks assigned to your department yet. Tasks appear here the moment admin or sales staff assign them.")));
}

// ================= MY ESTIMATES (customer) =================
function MyEstimates(p) {
  const db = p.db, user = p.user;
  const mine = (db.quotes || []).filter(function (qt) { return qt.customerId === user.id; });
  const [msg, setMsg] = useState("");
  return e(Card, null,
    e(SectionTitle, { title: T("My Estimates") + " (" + mine.length + ")" }),

    mine.length ? mine.map(function (qt) {
      const tt = quoteTotals(qt);
      return e("div", { key: qt.id, style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", padding: "10px 0", borderBottom: "1px solid " + C.canvas } },
        e("b", { className: "pcode", style: { minWidth: 100 } }, qt.id),
        qt.complaintId ? e("span", { className: "pcode", style: { fontSize: 11, cursor: "pointer" }, onClick: function () { p.onOpen(qt.complaintId); } }, qt.complaintId) : null,
        e("span", { style: { flex: "1 1 140px", fontSize: 13 } }, (qt.items || []).length + " item(s)"),
        e("b", { style: { whiteSpace: "nowrap", color: C.amber } }, inr(tt.grand)),
        e(ApprovalPill, { qt: qt }),
        e("span", { style: { fontSize: 11, color: C.mute } }, fmtDate(qt.at)),
        e(Btn, { small: true, onClick: function () { quotePdf(qt).catch(function (e2) { setMsg("PDF engine could not load: " + e2.message); }); }, label: "PDF" }),
        !qt.approval ? e(Btn, { small: true, kind: "accent", onClick: function () { p.onOpen(qt.complaintId); }, label: T("Review & approve") }) : null);
    }) : e("div", { style: { fontSize: 13, color: C.mute } }, T("No estimates yet.")));
}

// ================= CUSTOMER HOME =================
function CustomerHome(p) {
  const db = p.db, user = p.user;
  const mine = db.complaints.filter(function (c) { return c.customerId === user.id; });
  const pendingQuotes = (db.quotes || []).filter(function (qt) {
    return qt.complaintId && !qt.approval && mine.some(function (c) { return c.id === qt.complaintId; });
  });
  return e("div", null,
    e(RatePrompt, { db: db, user: user, refresh: p.refresh }),
    pendingQuotes.length ? e(Card, { style: { marginBottom: 16, background: C.amberBg, borderColor: "#f2e2ad" } },
      e(SectionTitle, { title: "\u23F3 " + pendingQuotes.length + " cost estimate" + (pendingQuotes.length === 1 ? "" : "s") + " awaiting your approval" }),
      pendingQuotes.map(function (qt) {
        return e("div", { key: qt.id, style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", padding: "8px 0", borderBottom: "1px solid #f2e2ad" } },
          e("b", { className: "pcode" }, qt.id),
          e("span", { style: { flex: "1 1 160px", fontSize: 13 } }, "For complaint " + qt.complaintId + " \u00B7 Total " + inr(quoteTotals(qt).grand) + " incl. GST"),
          e(Btn, { small: true, kind: "accent", onClick: function () { p.onOpen(qt.complaintId); }, label: "Review & approve" }));
      })) : null,
    e("div", { style: { display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 } },
      e(StatCard, { label: "My complaints", value: mine.length }),
      e(StatCard, { label: "Open", value: mine.filter(function (c) { return c.status !== "Closed"; }).length, color: C.blue }),
      e(StatCard, { label: "Closed", value: mine.filter(function (c) { return c.status === "Closed"; }).length, color: C.green })),
    e(Card, { style: { padding: 0, overflow: "hidden" } },
      e(ComplaintTable, { db: db, list: mine, team: false, onOpen: p.onOpen })));
}

if (typeof window !== "undefined" && window.__SD_TEST) {
  window.__helpers = {

  };

// ================= MOUNT =================
// QR deep link support: /?plant=...&machine=... (from printed machine stickers)
try {
  const usp = new URLSearchParams(window.location.search);
  if (usp.get("machine") || usp.get("plant")) {
    window.__SD_QR = { plant: usp.get("plant") || "", machine: usp.get("machine") || "" };
    try { window.history.replaceState(null, "", window.location.pathname); } catch (e2) {}
  }
} catch (e2) {}
applyBrand(Store.get("jm8_brand") || DEFAULT_BRAND);
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(e(App));
} catch (err) {
  document.getElementById("root").innerHTML = "<div style='padding:24px;font-family:sans-serif;color:#c0362c'>The app failed to start: " + (err && err.message ? err.message : String(err)) + "</div>";
}
